# =============================================================================
# ODL_HYBRID —— 跟随上游自动构建 WeKnora 的 odl-hybrid 镜像（GHCR，无需 Docker Hub）
#
# 触发：
#   · schedule 每周一 03:00 UTC：自动检查上游是否有变化
#   · push 到 main 且改了 Dockerfile / 本 workflow
#   · 手动 workflow_dispatch（可 force 强制重建）
#
# “跟随上游”的两条判定（任一变化即产生新 tag → 触发重建）：
#   1. PyPI 上 opendataloader-pdf 的 latest 版本
#   2. 上游 Tencent/WeKnora main 分支 docker/Dockerfile.odl-hybrid 的 sha256 前 12 位
#   tag 形如：odl2.4.7-w1a2b3c4d5e6f
#   若该 tag 在 GHCR 已存在则跳过构建（幂等，不重复烧 CI 分钟）。
#
# 凭据：只用内置 GITHUB_TOKEN（permissions.packages: write），无需任何 Secret。
# =============================================================================
name: build-odl-hybrid

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（即使同 tag 已存在）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: odl-hybrid-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/odl_hybrid

jobs:
  detect:
    name: 检测上游变化
    runs-on: ubuntu-24.04
    outputs:
      odl: ${{ steps.v.outputs.odl }}
      upstream_sha: ${{ steps.v.outputs.up }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.chk.outputs.exists }}
    steps:
      - name: 解析上游版本
        id: v
        run: |
          set -euo pipefail
          odl=$(curl -fsSL https://pypi.org/pypi/opendataloader-pdf/json | jq -r '.info.version')
          up=$(curl -fsSL https://raw.githubusercontent.com/Tencent/WeKnora/main/docker/Dockerfile.odl-hybrid \
               | sha256sum | cut -c1-12)
          tag="odl${odl}-w${up}"
          echo "odl=$odl"  >> "$GITHUB_OUTPUT"
          echo "up=$up"    >> "$GITHUB_OUTPUT"
          echo "tag=$tag"  >> "$GITHUB_OUTPUT"
          echo "opendataloader-pdf=$odl  upstream-dockerfile-sha=$up  tag=$tag"

      - name: 登录 GHCR（用于检查 tag 是否已存在）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查镜像是否已存在
        id: chk
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "→ $IMAGE:${{ steps.v.outputs.tag }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "→ $IMAGE:${{ steps.v.outputs.tag }} 不存在，需要构建"
          fi

  build:
    name: 构建并推送
    needs: detect
    if: needs.detect.outputs.exists == 'false' || github.event.inputs.force == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像坐标
        id: meta
        run: |
          echo "image=${IMAGE}:${{ needs.detect.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "target=${IMAGE}:${{ needs.detect.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.detect.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            ODL_PDF_SPEC=opendataloader-pdf[hybrid]==${{ needs.detect.outputs.odl }}
            PIP_INDEX_URL_CN=https://pypi.tuna.tsinghua.edu.cn/simple
            UPSTREAM_SHA=${{ needs.detect.outputs.upstream_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 回拉验证（registry 可拉取）
        run: docker pull "${{ env.IMAGE }}:${{ needs.detect.outputs.tag }}"

      - name: Smoke test（/health + 4g 运行期约束）
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}:${{ needs.detect.outputs.tag }}"
          docker rm -f odl-smoke >/dev/null 2>&1 || true
          docker run -d --name odl-smoke --memory 4g -p 127.0.0.1:15002:5002 "$IMG"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15002/health >/dev/null; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::/health 未通过"
            docker logs --tail 200 odl-smoke || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:15002/health; echo
          docker inspect -f 'health={{.State.Health.Status}} oomKilled={{.State.OOMKilled}}' odl-smoke
          docker stats --no-stream --format 'mem={{.MemUsage}}' odl-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f odl-smoke >/dev/null 2>&1 || true

      - name: 汇总
        run: |
          {
            echo "## 构建产物"
            echo ""
            echo '```'
            echo "image : ${{ env.IMAGE }}:${{ needs.detect.outputs.tag }}"
            echo "tag   : ${{ needs.detect.outputs.tag }}"
            echo "odl   : opendataloader-pdf ${{ needs.detect.outputs.odl }}"
            echo "上游  : Tencent/WeKnora docker/Dockerfile.odl-hybrid sha256=${{ needs.detect.outputs.upstream_sha }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo ""
            echo "拉取：\`docker pull ${{ env.IMAGE }}:${{ needs.detect.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
